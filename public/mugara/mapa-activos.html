<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUGARA — Mapa de activos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"IBM Plex Sans",system-ui,sans-serif;
    background:var(--bg); color:var(--fg);
    transition:background .35s ease,color .35s ease;
  }
  /* ---- themes ---- */
  body[data-theme="magma"]{
    --bg:#080f1c; --panel:#0e1a2c; --panel2:#122238; --fg:#e8eef6; --dim:#8ea3bd;
    --line:#1e3450; --accent:#2fd6c8; --ocean:#0a1526; --nodata:#152437; --nodataLine:#22364f;
    --shadow:0 18px 40px -24px #000;
  }
  body[data-theme="claro"]{
    --bg:#f7f5f1; --panel:#fffefb; --panel2:#f1ede6; --fg:#1d1b18; --dim:#6f6a62;
    --line:#e0dad0; --accent:#17b3a6; --ocean:#eeeae3; --nodata:#e6e1d9; --nodataLine:#d6cfc4;
    --shadow:0 16px 36px -26px #6b6257;
  }
  body[data-theme="tinta"]{
    --bg:#121212; --panel:#1a1a1a; --panel2:#222; --fg:#f2f0ec; --dim:#9a9691;
    --line:#2e2e2e; --accent:#2fd6c8; --ocean:#151515; --nodata:#242424; --nodataLine:#333;
    --shadow:0 18px 40px -26px #000;
  }
  .wrap{max-width:1440px;margin:0 auto;padding:24px}
  header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;
    border-bottom:1px solid var(--line);padding-bottom:20px}
  .kicker{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
  h1{font-family:Archivo,sans-serif;font-weight:800;font-size:clamp(28px,4vw,44px);line-height:1.02;margin:0;letter-spacing:-.015em;text-transform:uppercase}
  h1 span{display:block;font-weight:500;font-size:clamp(13px,1.4vw,17px);letter-spacing:.06em;color:var(--dim);text-transform:none;margin-top:10px}
  .themes{display:flex;gap:8px;align-items:center}
  .themes b{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:400;margin-right:4px}
  .tbtn{font:500 12px/1 "IBM Plex Sans",sans-serif;padding:9px 13px;border-radius:999px;cursor:pointer;
    background:transparent;color:var(--dim);border:1px solid var(--line)}
  .tbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#08131f}
  /* ---- stats ---- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);
    border:1px solid var(--line);margin:24px 0 20px}
  .stat{background:var(--panel);padding:16px 18px}
  .stat i{display:block;font-family:Archivo,sans-serif;font-style:normal;font-weight:800;font-size:30px;line-height:1}
  .stat s{display:block;text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:8px}
  /* ---- controls ---- */
  .controls{position:absolute;top:14px;left:14px;z-index:6;max-width:calc(100% - 190px);transform-origin:top left}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:8px 13px;font:500 12px/1 "IBM Plex Sans",sans-serif;color:var(--dim)}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
  .chip,.legend span,.tbtn,.maptools button{transition:transform .2s ease,box-shadow .25s ease,filter .25s ease,border-color .25s ease}
  .chip:hover,.chip:focus-visible,.tbtn:hover,.tbtn:focus-visible,.maptools button:hover,.maptools button:focus-visible{transform:translateY(-1px);border-color:currentColor;filter:brightness(1.15);box-shadow:0 0 0 2px color-mix(in srgb,currentColor 25%,transparent),0 0 16px color-mix(in srgb,currentColor 45%,transparent)}
  .legend span:hover{transform:translateY(-1px);filter:drop-shadow(0 0 7px currentColor)}
  .legend span:hover i{box-shadow:0 0 12px currentColor;transform:scale(1.18)}
  .legend i{transition:transform .2s ease,box-shadow .25s ease}
  .chip[aria-pressed="true"]{color:var(--fg);border-color:currentColor}
  /* ---- layout ---- */
  .mapbox{position:relative;background:var(--ocean);border:1px solid var(--line);overflow:hidden}
  .mapbox:fullscreen,.mapbox:-webkit-full-screen{width:100vw;height:100vh;background:var(--ocean);border:none}
  .mapbox:fullscreen svg.map,.mapbox:-webkit-full-screen svg.map{height:100%}
  svg.map{display:block;width:100%;height:auto}
  path.grat{fill:none;stroke:var(--nodataLine);stroke-width:.4;opacity:.55;pointer-events:none;vector-effect:non-scaling-stroke}
  path.sphere{fill:none;stroke:var(--nodataLine);stroke-width:.9;opacity:.8;pointer-events:none;vector-effect:non-scaling-stroke}
  g.deco{pointer-events:none}
  g.deco line{stroke:var(--nodataLine);stroke-width:.7;opacity:.7}
  g.deco text{font-family:"IBM Plex Mono",monospace;font-size:7px;letter-spacing:.14em;fill:var(--dim);opacity:.7}
  path.country{stroke:var(--ocean);stroke-width:.4;cursor:default;transition:fill-opacity .18s ease;vector-effect:non-scaling-stroke}
  path.country.has-assets{cursor:pointer}
  path.country.muted{fill-opacity:.16}
  path.country.dim{fill-opacity:.28}
  .mapbox.lines-mode path.country{fill:none !important;stroke:var(--nodataLine);stroke-width:.8}
  .asset-marker{cursor:pointer}
  .asset-marker circle{stroke:var(--ocean);stroke-width:1;vector-effect:non-scaling-stroke}
  .asset-marker.dim{opacity:.22}
  .asset-marker.active circle{stroke:var(--fg);stroke-width:1.4}
  .asset-marker__visual{transition:transform .18s ease;transform-box:fill-box;transform-origin:center}
  .asset-marker:hover .asset-marker__visual{transform:scale(1.3)}
  /* En pantalla completa el SVG se estira a toda la pantalla física, así
     que los marcadores se ven mucho más grandes — se reducen 50% para
     compensar. */
  .mapbox:fullscreen .asset-marker__visual,
  .mapbox:-webkit-full-screen .asset-marker__visual{transform:scale(.5)}
  .mapbox:fullscreen .asset-marker:hover .asset-marker__visual,
  .mapbox:-webkit-full-screen .asset-marker:hover .asset-marker__visual{transform:scale(.65)}
  .asset-marker__ping{opacity:0;pointer-events:none;transform-box:fill-box;transform-origin:center;vector-effect:non-scaling-stroke}
  .asset-marker:hover .asset-marker__ping{animation:energy-marker-ping 1.1s ease-out infinite}
  @keyframes energy-marker-ping{
    0%{transform:scale(1);opacity:.85}
    100%{transform:scale(2.6);opacity:0}
  }
  /* Resplandor que sigue al mouse sobre el mapa, coloreado por tierra/mar */
  .map-cursor-glow{
    position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;
    transition:opacity .25s ease;
    background:radial-gradient(circle 220px at var(--cursor-x,50%) var(--cursor-y,50%),
      color-mix(in srgb, var(--cursor-color, #4fd1e8) 38%, transparent), transparent 70%);
  }
  .map-cursor-glow.on{opacity:1}
  .pop{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
    background:var(--panel2);border:1px solid var(--line);box-shadow:var(--shadow);
    padding:10px 12px;min-width:150px;transition:opacity .14s ease;z-index:5}
  .pop.on{opacity:1}
  .pop .r{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .pop .t{font-family:Archivo,sans-serif;font-weight:600;font-size:14px;margin-top:4px}
  .pop .s{font-size:12px;color:var(--dim);margin-top:3px}
  .chip-pop{position:fixed;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
    background:var(--panel2);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;
    padding:10px 12px;min-width:180px;max-width:240px;transition:opacity .14s ease;z-index:50}
  .chip-pop.on{opacity:1}
  .chip-pop .r{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .chip-pop .t{font-family:Archivo,sans-serif;font-weight:600;font-size:14px;margin-top:4px}
  .chip-pop .s{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.45}
  .maptools{position:absolute;top:14px;right:14px;z-index:6;display:flex;gap:8px;transform-origin:top right}
  .maptools button{font:500 11px/1 "IBM Plex Sans",sans-serif;padding:8px 12px;border-radius:8px;cursor:pointer;
    background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
  .maptools button:hover{border-color:var(--accent)}
  .legend{display:flex;flex-wrap:wrap;gap:14px 22px;padding:14px 16px;border-top:1px solid var(--line);background:var(--panel)}
  .legend span{display:flex;align-items:center;gap:8px;font:400 11px/1 "IBM Plex Sans",sans-serif;color:var(--dim)}
  .legend i{width:14px;height:14px;border-radius:50%;display:block}
  a{color:var(--accent)}
  a:hover{color:var(--fg)}
  footer{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;
    justify-content:space-between;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim)}
  @media (max-width:980px){
    header.top{align-items:flex-start}
    .themes{width:100%}
  }
  @media (max-width:640px){
    .wrap{padding:14px}
    .stats{grid-template-columns:1fr 1fr}
    .stat{padding:13px 14px}
    .stat i{font-size:24px}
    .chips{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;-webkit-overflow-scrolling:touch}
    .chip{flex:none}
    .legend{gap:9px 14px;padding:12px}
    .legend span{font-size:10px}
    .pop{min-width:130px;padding:8px 10px}
    .pop .t{font-size:13px}
    g.deco text{display:none}
    footer{font-size:9px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none}
  }
</style>
</head>
<body data-theme="magma">
<div class="wrap">
  <header class="top">
    <div>
      <p class="kicker">Global Energy Data</p>
      <h1 id="map-title">Mapa de activos<span>49 plantas renovables de referencia a nivel mundial · coordenadas aproximadas, pendientes de validar contra Global Energy Monitor</span></h1>
    </div>
    <div class="themes">
      <b id="theme-label">Tema</b>
      <button class="tbtn" data-theme="magma" aria-pressed="true">Magma</button>
      <button class="tbtn" data-theme="claro" aria-pressed="false">Claro</button>
      <button class="tbtn" data-theme="tinta" aria-pressed="false">Tinta</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="mapbox" id="mapbox">
    <div class="map-cursor-glow" id="cursor-glow"></div>
    <svg class="map" id="map" viewBox="0 0 960 500" role="img" aria-label="Mapa mundial de activos renovables MUGARA"></svg>
    <div class="pop" id="pop"></div>
    <div class="chip-pop" id="chip-pop"></div>
    <div class="controls">
      <div class="chips" id="chips"></div>
    </div>
    <div class="maptools">
      <button type="button" id="zoom-reset">Vista completa</button>
      <button type="button" id="lines-toggle">Líneas</button>
      <button type="button" id="fullscreen-toggle">Pantalla completa</button>
    </div>
  </div>
  <div class="legend" id="legend"></div>

  <footer>
    <span id="footer-data">MUGARA — datos reales, coordenadas aproximadas</span>
    <span id="footer-source">Países: Natural Earth 1:110m · Activos: muestra MUGARA 04_DATOS_GLOBALES</span>
  </footer>
</div>

<script>

const MAP_ENGLISH = MAP_LANGUAGE === "en";
document.documentElement.lang = MAP_LANGUAGE;
if (MAP_ENGLISH) {
  document.getElementById("map-title").innerHTML = "Asset map<span>49 benchmark renewable plants worldwide · approximate coordinates pending validation against Global Energy Monitor</span>";

  document.querySelector('[data-theme="tinta"]').textContent = "Ink";

// País (español, como viene en la fuente MUGARA) → nombre en el dataset de
// países (Natural Earth / world-atlas). "Brasil / Paraguay" se reparte entre
// los dos países reales para pintar ambos por Itaipú.
const COUNTRY_ES_TO_EN = {
  "China": "China", "India": "India", "Egipto": "Egypt",
  "Emiratos Árabes Unidos": "United Arab Emirates", "Suecia": "Sweden",
  "Reino Unido": "United Kingdom", "Países Bajos": "Netherlands",
  "Taiwán": "Taiwan", "Brasil": "Brazil", "Paraguay": "Paraguay",
  "Venezuela": "Venezuela", "Estados Unidos": "United States of America",
  "Rusia": "Russia", "Italia": "Italy", "México": "Mexico",
  "Filipinas": "Philippines", "Indonesia": "Indonesia", "Islandia": "Iceland",
};

function countryTokens(asset) {
  return asset.country.split("/").map((s) => s.trim());
}

const located = ASSETS.filter((a) => a.lat != null && a.lng != null);

// Capacidad total por tecnología, por cada país real (para pintar cada país
// por su tecnología dominante — la de mayor MW instalada allí).
const capacityByCountryTech = new Map();
ASSETS.forEach((asset) => {
  countryTokens(asset).forEach((token) => {
    const enName = COUNTRY_ES_TO_EN[token] ?? token;
    if (!capacityByCountryTech.has(enName)) capacityByCountryTech.set(enName, {});
    const rec = capacityByCountryTech.get(enName);
    rec[asset.technology] = (rec[asset.technology] ?? 0) + asset.capacityMW;
  });
});
function dominantTechFor(countryName) {
  const rec = capacityByCountryTech.get(countryName);
  if (!rec) return null;
  return Object.entries(rec).sort((a, b) => b[1] - a[1])[0][0];
}

const svg = d3.select("#map");
const projection = d3.geoNaturalEarth1().fitExtent([[10, 14], [950, 486]], { type: "Sphere" });

const zoomG = svg.append("g").attr("class", "zoomable");
const gGrid = zoomG.append("g");
const gCountries = zoomG.append("g");
const gMarkers = zoomG.append("g");
const graticule = d3.geoGraticule().step([20, 20]);
gGrid.append("path").attr("class", "sphere").attr("d", path({ type: "Sphere" }));
gGrid.append("path").attr("class", "grat").attr("d", path(graticule()));
const gDeco = svg.append("g").attr("class", "deco");
(function frame() {
  const marks = [-60, -30, 0, 30, 60];
  marks.forEach((lat) => {
    const y = projection([0, lat])[1];
    gDeco.append("line").attr("x1", 10).attr("x2", 22).attr("y1", y).attr("y2", y);
    gDeco.append("line").attr("x1", 938).attr("x2", 950).attr("y1", y).attr("y2", y);
    gDeco.append("text").attr("x", 26).attr("y", y + 2.5).text((lat > 0 ? "N" : lat < 0 ? "S" : "EQ") + (lat ? Math.abs(lat) + "°" : ""));
  });
})();

const pop = document.getElementById("pop");
const mapbox = document.getElementById("mapbox");
const NODATA = () => getComputedStyle(document.body).getPropertyValue("--nodata").trim();

let filter = null; // tech key
let selectedId = null;

function isInk() { return document.body.dataset.theme === "tinta"; }

function countryFill(feature) {
  const dom = dominantTechFor(feature.properties.name);
  if (!dom) return NODATA();
  if (isInk() && filter && filter !== dom) return "#3a3a3a";
  return TECHNOLOGY_META[dom].color;
}

function paint() {
  gCountries.selectAll("path.country")
    .attr("fill", countryFill)
    .classed("dim", (d) => {
      const dom = dominantTechFor(d.properties.name);
      return !!dom && !!filter && filter !== dom;
    });
  gMarkers.selectAll(".asset-marker")
    .classed("dim", (d) => !!filter && filter !== d.technology)
    .classed("active", (d) => d.id === selectedId);
  document.querySelectorAll(".chip").forEach((c) => {
    const on = c.dataset.tech === filter;
    c.style.color = on ? TECHNOLOGY_META[c.dataset.tech].color : "";
    c.setAttribute("aria-pressed", on);
  });
}

function showPop(x, y, kicker, title, sub) {
  const subs = (Array.isArray(sub) ? sub : [sub]).filter(Boolean).map((s) => `<div class="s">${s}</div>`).join("");
  pop.innerHTML = `<div class="r">${kicker}</div><div class="t">${title}</div>${subs}`;
  const w = mapbox.getBoundingClientRect().width;
  pop.style.left = Math.max(78, Math.min(w - 78, x)) + "px";
  pop.style.top = Math.max(58, y - 14) + "px";
  pop.classList.add("on");
}
const hidePop = () => pop.classList.remove("on");

function svgToBox(sx, sy) {
  const rect = mapbox.getBoundingClientRect();
  return [(sx / 960) * rect.width, (sy / 500) * rect.height];
}

// Zoom con scroll del mouse (y arrastre para desplazar) sobre el propio
// SVG — la misma transformación se reutiliza para el zoom programático
// (chips, marcadores, "Vista completa") llamando a zoom.transform, así
// ambos mecanismos quedan sincronizados y no se pisan entre sí.
const controlsEl = document.querySelector(".controls");
const maptoolsEl = document.querySelector(".maptools");
const MAX_UI_SCALE = 1.3;

function syncControlsScale(k) {
  const uiScale = Math.min(k, MAX_UI_SCALE);
  controlsEl.style.transform = `scale(${uiScale})`;
  maptoolsEl.style.transform = `scale(${uiScale})`;
}

const zoom = d3.zoom()
  .scaleExtent([1, 12])
  .on("zoom", (event) => {
    zoomG.attr("transform", event.transform);
    syncControlsScale(event.transform.k);
  });
svg.call(zoom).on("dblclick.zoom", null);

function zoomToPoints(points) {
  if (!points.length) return;
  const xs = points.map((p) => p[0]);
  const ys = points.map((p) => p[1]);
  const [x0, x1] = [Math.min(...xs), Math.max(...xs)];
  const [y0, y1] = [Math.min(...ys), Math.max(...ys)];
  const pad = 60;
  const w = Math.max(x1 - x0, 20) + pad * 2;
  const h = Math.max(y1 - y0, 20) + pad * 2;
  const k = Math.min(7, Math.max(1, Math.min(960 / w, 500 / h)));
  const cx = (x0 + x1) / 2;
  const cy = (y0 + y1) / 2;
  const t = d3.zoomIdentity.translate(480, 250).scale(k).translate(-cx, -cy);
  svg.transition().duration(650).call(zoom.transform, t);
}
function resetZoom() {
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
}

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then((topo) => {
  const features = topojson.feature(topo, topo.objects.countries).features;

  gCountries.selectAll("path.country").data(features).join("path")
    .attr("class", (d) => "country" + (dominantTechFor(d.properties.name) ? " has-assets" : ""))
    .attr("d", path)
    .on("mousemove", (ev, d) => {
      const dom = dominantTechFor(d.properties.name);
      if (!dom) { hidePop(); return; }
      const meta = TECHNOLOGY_META[dom];
      const [cx, cy] = path.centroid(d);
      const [x, y] = svgToBox(cx, cy);
      showPop(x, y, meta.label, d.properties.name, "Tecnología dominante por MW instalado");
    })
    .on("mouseleave", hidePop)
    .on("click", (ev, d) => {
      const dom = dominantTechFor(d.properties.name);
      if (dom) { filter = filter === dom ? null : dom; paint(); zoomToTech(filter); }
    });

  renderMarkers();
  buildChips();
  buildLegend();
  buildStats();
  paint();
  focusAssetFromUrl();
});

function focusAssetFromUrl() {
  const assetId = new URLSearchParams(location.search).get("asset");
  const asset = located.find((item) => item.id === assetId);
  if (!asset) return;
  selectedId = asset.id;
  filter = null;
  paint();
  zoomToPoints([projection([asset.lng, asset.lat])]);
  setTimeout(() => {
    const [x, y] = svgToBox(...projection([asset.lng, asset.lat]));
    const meta = TECHNOLOGY_META[asset.technology];
    showPop(x, y, meta.label, asset.name, [
      `${asset.country}${asset.region ? " · " + asset.region : ""}`,
      `${asset.subtype} · ${asset.capacityMW.toLocaleString("es-ES")} MW · ${asset.status}`,
    ]);
  }, 700);
}

function renderMarkers() {
  gMarkers.selectAll(".asset-marker").data(located, (d) => d.id).join((enter) => {
    const g = enter.append("g")
      .attr("class", "asset-marker")
      .attr("transform", (d) => { const [x, y] = projection([d.lng, d.lat]); return `translate(${x},${y})`; })
      .on("mousemove", (ev, d) => {
        const [x, y] = svgToBox(...projection([d.lng, d.lat]));
        const meta = TECHNOLOGY_META[d.technology];
        const lines = [
          `${d.country}${d.region ? " · " + d.region : ""}`,
          `${d.subtype} · ${d.capacityMW.toLocaleString("es-ES")} MW · ${d.status}`,
          `Fuente: ${d.source}`,
        ];
        if (d.coordsConfidence === "aproximada") {
          lines.push("Ubicación aproximada — pendiente de validar contra Global Energy Monitor.");
        }
        showPop(x, y, meta.label, d.name, lines);
      })
      .on("mouseleave", hidePop)
      .on("click", (ev, d) => {
        ev.stopPropagation();
        selectedId = d.id;
        paint();
        zoomToPoints([projection([d.lng, d.lat])]);
      });
    // Anillo de "ping" (solo visible en :hover, ver CSS) + el marcador en sí,
    // agrupados en .asset-marker__visual para poder animar/escalar ambos
    // juntos (posición aparte, en el transform del <g> exterior) — incluida
    // la reducción al 50% en pantalla completa (ver CSS ":fullscreen").
    const visual = g.append("g").attr("class", "asset-marker__visual");
    visual.append("circle")
      .attr("class", "asset-marker__ping")
      .attr("r", 6)
      .attr("fill", "none")
      .attr("stroke", (d) => TECHNOLOGY_META[d.technology].color)
      .attr("stroke-width", 2);
    visual.append("circle").attr("r", 6).attr("fill", (d) => TECHNOLOGY_META[d.technology].color);
    visual.append("g").attr("transform", "scale(0.34) translate(-12,-12)")
      .each(function (d) { this.innerHTML = TECHNOLOGY_ICON_INNER[d.technology]; })
      .selectAll("*").attr("stroke", "#0b1120").attr("stroke-width", 1.6).attr("stroke-linecap", "round");
    return g;
  });
}

/* ---------- chips + legend + stats ---------- */
function techStats(techKey) {
  const items = ASSETS.filter((a) => a.technology === techKey);
  const totalMW = items.reduce((sum, a) => sum + a.capacityMW, 0);
  const countries = new Set();
  items.forEach((a) => countryTokens(a).forEach((c) => countries.add(c)));
  return { count: items.length, totalMW, countries: [...countries] };
}

const chipPop = document.getElementById("chip-pop");
function showChipPop(button) {
  const key = button.dataset.tech;
  const meta = TECHNOLOGY_META[key];
  const { count, totalMW, countries } = techStats(key);
  chipPop.innerHTML = `
    <div class="r">${meta.label}</div>
    <div class="t">${count} planta${count === 1 ? "" : "s"} · ${(totalMW / 1000).toFixed(1)} GW</div>
    <div class="s">${countries.join(", ")}</div>`;
  const rect = button.getBoundingClientRect();
  chipPop.style.left = rect.left + rect.width / 2 + "px";
  chipPop.style.top = rect.top - 10 + "px";
  chipPop.classList.add("on");
}
function hideChipPop() { chipPop.classList.remove("on"); }

function buildChips() {
  const c = document.getElementById("chips");
  c.innerHTML = Object.entries(TECHNOLOGY_META).map(([key, meta]) =>
    `<button class="chip" data-tech="${key}" aria-pressed="false"><span class="dot" style="color:${meta.color}"></span>${meta.label}</button>`).join("");
  c.querySelectorAll(".chip").forEach((b) => {
    b.onclick = () => {
      filter = filter === b.dataset.tech ? null : b.dataset.tech;
      paint(); zoomToTech(filter); hideChipPop();
    };
    b.addEventListener("mouseenter", () => showChipPop(b));
    b.addEventListener("mouseleave", hideChipPop);
    b.addEventListener("focus", () => showChipPop(b));
    b.addEventListener("blur", hideChipPop);
  });
}
function zoomToTech(techKey) {
  if (!techKey) { resetZoom(); return; }
  const pts = located.filter((a) => a.technology === techKey).map((a) => projection([a.lng, a.lat]));
  zoomToPoints(pts);
}
function buildLegend() {
  const unlocatedAssets = ASSETS.filter((a) => a.lat == null || a.lng == null);
  const unlocatedNote = unlocatedAssets.length
    ? `<span>⚠ ${unlocatedAssets.map((a) => a.name).join(", ")} — sin ubicación confirmada, no se muestra en el mapa</span>`
    : "";
  document.getElementById("legend").innerHTML =
    Object.values(TECHNOLOGY_META).map((m) => `<span><i style="background:${m.color}"></i>${m.label}</span>`).join("") +
    `<span><i style="background:${NODATA()}"></i>Sin activos en el país</span>` +
    unlocatedNote;
}
function buildStats() {
  const totalMW = ASSETS.reduce((sum, a) => sum + a.capacityMW, 0);
  const countries = new Set();
  ASSETS.forEach((a) => countryTokens(a).forEach((t) => countries.add(t)));
  const rows = [
    [ASSETS.length, MAP_ENGLISH ? "Assets" : "Activos"],
    [(totalMW / 1000).toFixed(1) + " GW", MAP_ENGLISH ? "Total capacity" : "Capacidad total"],
    [Object.keys(TECHNOLOGY_META).length, MAP_ENGLISH ? "Technologies" : "Tecnologías"],
    [countries.size, MAP_ENGLISH ? "Countries" : "Países"],
  ];
  document.getElementById("stats").innerHTML = rows.map(([i, s]) => `<div class="stat"><i>${i}</i><s>${s}</s></div>`).join("");
}

document.getElementById("zoom-reset").onclick = () => { filter = null; selectedId = null; paint(); resetZoom(); };
document.getElementById("lines-toggle").onclick = (e) => {
  const on = mapbox.classList.toggle("lines-mode");
  e.currentTarget.textContent = on ? (MAP_ENGLISH ? "Colors" : "Colores") : (MAP_ENGLISH ? "Lines" : "Líneas");
};

// --- Pantalla completa -------------------------------------------------
const fullscreenBtn = document.getElementById("fullscreen-toggle");
function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
fullscreenBtn.onclick = () => {
  if (!isFullscreen()) {
    const request = mapbox.requestFullscreen || mapbox.webkitRequestFullscreen;
    request?.call(mapbox)?.catch(() => {});
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    exit?.call(document)?.catch(() => {});
  }
};
function syncFullscreenLabel() {
  fullscreenBtn.textContent = isFullscreen() ? (MAP_ENGLISH ? "Exit fullscreen" : "Salir de pantalla completa") : (MAP_ENGLISH ? "Fullscreen" : "Pantalla completa");
}
document.addEventListener("fullscreenchange", syncFullscreenLabel);
document.addEventListener("webkitfullscreenchange", syncFullscreenLabel);

document.querySelectorAll(".tbtn").forEach((b) => b.onclick = () => {
  document.body.dataset.theme = b.dataset.theme;
  document.querySelectorAll(".tbtn").forEach((x) => x.setAttribute("aria-pressed", x === b));
  buildLegend(); paint();
});

// --- Resplandor tierra/mar que sigue al cursor sobre el mapa -----------
const cursorGlow = document.getElementById("cursor-glow");
const GLOW_LAND = "#f2a65a";
const GLOW_SEA = "#4fd1e8";
mapbox.addEventListener("mousemove", (event) => {
  const rect = mapbox.getBoundingClientRect();
  const isLand = !!event.target.closest?.("path.country");
  cursorGlow.style.setProperty("--cursor-x", `${event.clientX - rect.left}px`);
  cursorGlow.style.setProperty("--cursor-y", `${event.clientY - rect.top}px`);
  cursorGlow.style.setProperty("--cursor-color", isLand ? GLOW_LAND : GLOW_SEA);
  cursorGlow.classList.add("on");
});
mapbox.addEventListener("mouseleave", () => cursorGlow.classList.remove("on"));

addEventListener("resize", hidePop, { passive: true });
addEventListener("scroll", hideChipPop, { passive: true });
</script>
</body>
</html>
